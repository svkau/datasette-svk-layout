<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with Svenska kyrkan wine-red -->
  <circle cx="50" cy="50" r="50" fill="#74121D"/>

  <!-- Cross in gold/beige -->
  <g fill="#F5E6D3">
    <!-- Vertical beam -->
    <rect x="44" y="20" width="12" height="60" rx="2"/>
    <!-- Horizontal beam -->
    <rect x="30" y="38" width="40" height="12" rx="2"/>
  </g>

  <!-- Subtle shadow/depth effect -->
  <g opacity="0.2">
    <rect x="46" y="22" width="8" height="56" rx="1" fill="#000"/>
    <rect x="32" y="40" width="36" height="8" rx="1" fill="#000"/>
  </g>
</svg>
